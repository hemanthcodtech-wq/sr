# Netlify Configuration for SR Multi-Vendor Marketplace Frontend (Client Directory)
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Single Page Application (SPA) routing
# Ensures direct visits to /products, /login, /vendor/register, etc. don't 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
