<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SR Multi-Vendor Marketplace | Dream • Grow • Together</title>
    <meta name="description" content="SR Multi-Vendor Marketplace - Dream • Grow • Together. Discover premium verified vendors, electronics, fashion, grocery, direct merchant stores, and trusted commerce." />
    <meta name="keywords" content="SR, SR marketplace, multivendor, ecommerce, dream grow together, vendor portal, admin console, best deals" />
    <meta name="author" content="SR Multi-Vendor Marketplace" />
    <!-- Open Graph SEO -->
    <meta property="og:title" content="SR Multi-Vendor Marketplace | Dream • Grow • Together" />
    <meta property="og:description" content="Dream • Grow • Together on SR Multi-Vendor Marketplace with verified merchants across India." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
      /* Pre-React Instant Splash Loading Screen for page refreshes */
      #pre-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        color: #0f172a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        user-select: none;
      }
      .pre-loader-wrap {
        position: relative;
        width: 140px;
        height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
      }
      .pre-loader-spin {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3.5px solid rgba(245, 158, 11, 0.25);
        border-top-color: #f59e0b;
        animation: preSpin 0.75s linear infinite;
      }
      .pre-loader-img-box {
        width: 105px;
        height: 105px;
        border-radius: 50%;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      .pre-loader-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .pre-loader-sub {
        font-size: 13px;
        font-weight: 600;
        color: #64748b;
        letter-spacing: 0.5px;
      }
      @keyframes preSpin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-amber-100 selection:text-amber-900">
    <div id="root">
      <!-- Instant HTML Splash Screen: Replaced automatically when React mounts -->
      <div id="pre-loader">
        <div class="pre-loader-wrap">
          <div class="pre-loader-spin"></div>
          <div class="pre-loader-img-box">
            <img src="/logo.png" alt="SR Logo" class="pre-loader-img" />
          </div>
        </div>
        <div class="pre-loader-sub">Loading...</div>
      </div>
    </div>
    <!-- Razorpay Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
